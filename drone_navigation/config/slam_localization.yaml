slam_toolbox:
  ros__parameters:
    base_frame: base_link
    map_frame: map
    odom_frame: odom
    scan_topic: /scan
    mode: localization

    # map_file_name is set from the launch file (saved .posegraph, no extension)
    map_start_at_dock: true

    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    transform_publish_period: 0.02

    # 0.0 = process every scan; identity odom reports no motion, so any nonzero
    # gate freezes localization. Scan-matching then tracks pose directly.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0

    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: false

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
